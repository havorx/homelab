# Shared LXC config — inherited by all services
# Override any value in individual .conf files

TEMPLATE="local:vztmpl/debian-13-standard_13.1-2_amd64.tar.zst"
STORAGE="local-lvm"
BRIDGE="vmbr0"
CORES=1
SWAP=0
UNPRIVILEGED=1
ONBOOT=1

# SSH key must be uploaded to Proxmox host first:
#   scp ~/.ssh/id_ed25519.pub root@<proxmox>:/tmp/opencode.pub
SSH_KEY="/tmp/opencode.pub"

# DNS (inherits from Proxmox host if not set)
# SEARCHDOMAIN="home.arpa"
# NAMESERVER="192.168.1.1"
